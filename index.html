<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>FORJA · ponencias</title>
<!-- marked 18.1.2 vendorizado en vendor/: sin CDN. Si no carga, el lector muestra texto plano y sigue siendo anotable. -->
<script src="vendor/marked.umd.js"></script>
<style>
  :root{
    color-scheme:light;
    --paper:#ffffff;
    --panel:#ffffff;
    --line:#e2e2e2;
    --ink:#000000;
    --ink-dim:#5c5c5c;
    --moss:#586a45;         /* acento: foco, hover, resaltado */
    --steel:#4f6b82;        /* enlaces */
    --warm:#b06a36;         /* nota activa */
    --mono: "Fira Code", ui-monospace, "SF Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
    --r:2px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#ffffff}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--mono); font-size:12px; line-height:1.5;
    display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
  }

  /* ---- vistas: lista de ponencias / lector ---- */
  body.vista-lista .solo-lector{display:none !important}
  body.vista-lector .solo-lista{display:none !important}

  /* ---- cabecera ---- */
  header{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; row-gap:8px;
    padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel);
    flex:none;
  }
  #marca{
    margin:0; font-size:12px; font-weight:600; letter-spacing:.18em; color:var(--ink);
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  #marca:hover{color:var(--moss)}
  #docname{color:var(--ink-dim); font-size:11px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
  .acciones{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
  button{
    font-family:var(--mono); font-size:11px; letter-spacing:.03em; cursor:pointer;
    border-radius:var(--r); padding:6px 10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); transition:border-color .12s, color .12s, opacity .12s;
  }
  button:hover:not(:disabled){border-color:var(--moss); color:var(--moss)}
  button:disabled{opacity:.4; cursor:default}
  button:focus-visible{outline:2px solid var(--moss); outline-offset:1px}
  #contador{color:var(--ink-dim); font-size:10px; font-variant-numeric:tabular-nums; flex:none; min-width:9ch; text-align:right}
  .acciones button.inactivo{ opacity:.55; text-decoration:line-through; }

  /* ---- cuerpo: toc + lectura + panel ---- */
  main{display:flex; flex:1; min-height:0}
  #toc{
    width:240px; flex:none; display:none; overflow-y:auto;
    background:var(--panel); border-right:1px solid var(--line);
    padding:14px 8px 24px;
  }
  #toc h2, #panel h2, .rotulo{
    margin:0; font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-dim); font-weight:600;
  }
  #toc h2{margin:0 0 8px; padding:0 6px}
  .toc-it{
    display:block; padding:3px 6px; cursor:pointer; user-select:none;
    border-left:2px solid transparent; color:var(--ink-dim);
    font-size:11px; line-height:1.45; word-break:break-word;
    transition:color .12s, border-color .12s;
  }
  .toc-it:hover, .toc-it:focus{color:var(--moss); border-left-color:var(--moss); outline:none}
  .toc-it.n2{padding-left:18px}
  .toc-it.n3{padding-left:30px; font-size:10.5px}
  body.no-toc #toc{display:none !important}
  body.no-panel #panel{display:none !important}

  #read{
    flex:1; min-width:0; overflow-y:auto; position:relative;
    overscroll-behavior:contain;
    padding:32px 40px 120px;
  }
  #doc{
    max-width:68ch; margin:0;
    font-family:var(--serif); font-size:17px; line-height:1.75; color:var(--ink);
  }
  #doc.plano{font-family:var(--mono); font-size:13px; line-height:1.6; white-space:pre-wrap}
  #doc h1{font-size:1.7em; line-height:1.2; margin:0 0 .6em}
  #doc h2{font-size:1.35em; margin:1.6em 0 .5em}
  #doc h3{font-size:1.12em; margin:1.4em 0 .4em}
  #doc p{margin:0 0 1.05em; text-align:justify; hyphens:auto}
  #doc em{font-style:italic}
  #doc strong{font-weight:600}
  #doc a{color:var(--steel)}
  #doc blockquote{border-left:2px solid var(--moss); margin:1em 0; padding:.2em 0 .2em 1em; color:var(--ink)}
  #doc code{font-family:var(--mono); font-size:.85em; background:#0000000d; padding:.1em .3em; border-radius:var(--r)}
  #doc pre{overflow-x:auto; background:#0000000a; padding:.8em 1em; border-radius:var(--r)}
  #doc pre code{background:none; padding:0}
  #doc ul,#doc ol{padding-left:1.4em; margin:0 0 1.05em}
  #doc li{margin:.2em 0}
  #doc img{max-width:100%; height:auto}
  #doc hr{border:0; border-top:1px solid var(--line); margin:2em 0}
  #doc table{border-collapse:collapse; margin:0 0 1.05em; font-size:.9em}
  #doc th,#doc td{border:1px solid var(--line); padding:.3em .55em; text-align:left; vertical-align:top}

  /* resaltado sin mutar el DOM (offsets intactos) */
  ::highlight(forja-nota){ background:rgba(88,106,69,.20); }
  ::highlight(forja-activa){ background:rgba(176,106,54,.34); }

  /* ---- lista de ponencias ---- */
  #lista{max-width:72ch; margin:0 auto}
  .rotulo{margin-bottom:14px}
  .estado{color:var(--ink-dim); font-size:12px; line-height:1.55; margin:0 0 14px}
  .estado:empty{display:none}
  .estado button{margin-top:10px}
  #listaItems{list-style:none; margin:0; padding:0}
  #listaItems:not(:empty){border-top:1px solid var(--line)}
  .item{
    display:block; min-height:44px; padding:14px 6px; border-bottom:1px solid var(--line);
    color:var(--ink); text-decoration:none;
  }
  .item:hover .tit{color:var(--moss)}
  .item:focus-visible{outline:2px solid var(--moss); outline-offset:-2px}
  .tit{display:block; font-family:var(--serif); font-size:19px; line-height:1.3; transition:color .12s}
  .meta{display:block; margin-top:4px; color:var(--ink-dim); font-size:11px; word-break:break-word}
  #docEstado{max-width:64ch; margin:6vh auto 0}

  /* ---- panel de notas ---- */
  #panel{
    width:340px; flex:none; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  #panel h2{padding:12px 14px; border-bottom:1px solid var(--line)}
  #list{overflow-y:auto; padding:6px; flex:1; min-height:0}
  .vacio{color:var(--ink-dim); font-size:11px; padding:16px 10px; line-height:1.5}
  .nota{
    border:1px solid var(--line); border-radius:var(--r); background:var(--paper);
    padding:8px 9px; margin-bottom:8px; transition:border-color .12s;
  }
  .nota.activa{border-color:var(--warm)}
  .quote{
    font-family:var(--serif); font-size:12.5px; line-height:1.4; color:var(--ink);
    border-left:2px solid var(--moss); padding-left:8px; margin-bottom:6px; cursor:pointer;
  }
  .nota.activa .quote{border-left-color:var(--warm)}
  .quote:hover{color:var(--moss)}
  .coments{margin:2px 0 4px}
  .coment{border-left:2px solid var(--line); padding:3px 0 3px 8px; margin:4px 0}
  .coment-tx{font-family:var(--mono); font-size:11.5px; line-height:1.45; color:var(--ink); white-space:pre-wrap; word-break:break-word}
  .coment-meta{display:flex; align-items:center; justify-content:space-between; margin-top:2px; color:var(--ink-dim); font-size:9.5px}
  .cdel{padding:0 5px; font-size:13px; line-height:1; border-color:transparent; background:transparent; color:var(--ink-dim)}
  .cdel:hover{border-color:var(--warm); color:var(--warm)}
  .add{display:flex; gap:6px; margin-top:4px}
  .add-in{flex:1; resize:none; overflow:hidden; min-height:30px; background:var(--paper); color:var(--ink); border:1px solid var(--line); border-radius:var(--r); padding:5px 6px; font-family:var(--mono); font-size:11.5px; line-height:1.45}
  .add-in:focus{outline:1px solid var(--moss); border-color:var(--moss)}
  .add-btn{flex:none; padding:4px 9px; font-size:10px; align-self:flex-start}
  .fila{display:flex; align-items:center; justify-content:space-between; margin-top:5px; gap:8px}
  .pos{color:var(--ink-dim); font-size:9.5px; font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .del{padding:2px 7px; font-size:10px; flex:none}
  .del:hover{border-color:var(--warm); color:var(--warm)}
  .nota.huerfana{opacity:.72; border-style:dashed}
  .nota.huerfana .quote{border-left-color:var(--ink-dim)}

  /* ---- botón flotante de selección ---- */
  #fab{
    position:fixed; z-index:50; display:none;
    background:var(--moss); color:#ffffff; border-color:var(--moss); font-weight:600;
    box-shadow:0 2px 8px #0002; padding:6px 12px;
  }
  #fab.on{display:block}
  #fab:hover{background:var(--warm); border-color:var(--warm); color:#ffffff}

  /* ---- modo tablet: botón anotar fijo en el panel + objetivos táctiles ---- */
  body.tablet #fab{ display:none !important; }
  body.tablet .acciones button{ padding:9px 12px; min-height:44px; }
  body.tablet .add-in{ min-height:42px; font-size:13px }
  body.tablet .add-btn{ min-height:42px; padding:9px 13px }
  body.tablet .item{ padding:18px 6px }
  #tablet.activo{ border-color:var(--moss); color:var(--moss) }
  #anotarBtn{
    display:none; margin:8px; width:calc(100% - 16px);
    padding:13px 12px; font-size:14px; font-weight:600;
    background:var(--paper); color:var(--ink-dim); border:1px solid var(--line);
  }
  body.tablet #anotarBtn{ display:block }
  #anotarBtn.lista{ background:var(--moss); color:#ffffff; border-color:var(--moss) }

  .hide{display:none !important}

  /* ---- timer de la ponencia ---- */
  .t-wrap{position:relative; display:inline-flex}
  #timer{
    font-size:13px; font-weight:600; padding:7px 14px; min-width:9.5ch;
    font-variant-numeric:tabular-nums; letter-spacing:.04em;
  }
  body.tablet .acciones #timer{font-size:15px; padding:9px 16px}
  #timer.t-corriendo{border-color:var(--moss); color:var(--moss)}
  #timer.t-pausa{color:var(--ink-dim); border-style:dashed}
  #timer.t-aviso, #timer.t-aviso:hover{border-color:var(--warm); color:var(--warm)}
  #timer.t-excedido, #timer.t-excedido:hover{background:var(--warm); border-color:var(--warm); color:#ffffff}
  #timerPanel{
    position:absolute; top:calc(100% + 6px); left:0; z-index:80;
    width:280px; max-width:calc(100vw - 24px);
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:0 4px 14px #0002; padding:12px;
    display:flex; flex-direction:column; gap:10px;
  }
  .t-grande{font-size:36px; line-height:1.1; font-weight:600; text-align:center; font-variant-numeric:tabular-nums; letter-spacing:.03em; color:var(--ink)}
  .t-grande.f-aviso, .t-grande.f-excedido{color:var(--warm)}
  .t-estado{text-align:center; color:var(--ink-dim); font-size:10.5px; margin-top:-6px}
  .t-presets{display:flex; gap:6px}
  .t-presets button{flex:1; padding:6px 0}
  .t-presets button.sel{border-color:var(--moss); color:var(--moss)}
  .t-campo{display:flex; align-items:center; gap:8px; color:var(--ink-dim); font-size:11px}
  .t-campo span:first-child{min-width:7ch}
  .t-campo input{
    width:7ch; font-family:var(--mono); font-size:13px; padding:5px 6px; text-align:right;
    border:1px solid var(--line); border-radius:var(--r); background:var(--paper); color:var(--ink);
  }
  .t-campo input:focus{outline:1px solid var(--moss); border-color:var(--moss)}
  .t-acc{display:flex; gap:8px}
  .t-acc button{flex:1; padding:8px 0; font-size:12px}
  #timerPlay{background:var(--moss); border-color:var(--moss); color:#ffffff; font-weight:600}
  #timerPlay:hover{background:var(--warm); border-color:var(--warm); color:#ffffff}

  /* ---- contador de palabras (esquina inferior derecha) ---- */
  #stats{
    position:fixed; right:12px; bottom:12px; z-index:70; display:none;
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r);
    color:var(--ink-dim); font-size:10px; padding:3px 8px;
    font-variant-numeric:tabular-nums; letter-spacing:.02em; user-select:none;
  }

  /* ---- ajustes (esquina inferior izquierda) ---- */
  #controlesVis{position:fixed; left:12px; bottom:12px; z-index:40; display:none}
  #ajustesPanel{
    position:absolute; bottom:calc(100% + 8px); left:0;
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r);
    padding:10px 12px; box-shadow:0 4px 12px #0001;
    display:flex; flex-direction:column; gap:12px;
  }
  .ajuste-row{display:flex; align-items:center; gap:8px; color:var(--ink-dim); font-size:10px; user-select:none}
  .ajuste-row input{width:130px; accent-color:var(--moss); margin:0}
  .ajuste-row .val{color:var(--moss); font-variant-numeric:tabular-nums; min-width:4ch; text-align:right}
</style>
</head>
<body class="vista-lista">
  <header>
    <h1 id="marca" title="Recargar">FORJA · ponencias</h1>
    <div id="docname" aria-live="polite"></div>
    <div class="acciones">
      <span class="t-wrap">
        <button id="timer" aria-haspopup="dialog" aria-expanded="false" aria-controls="timerPanel" title="Timer de la ponencia">timer</button>
        <div id="timerPanel" class="hide" role="dialog" aria-label="Configurar timer">
          <div id="timerGrande" class="t-grande">20:00</div>
          <div id="timerEstado" class="t-estado"></div>
          <div class="t-presets" id="timerPresets">
            <button data-min="10">10</button><button data-min="15">15</button><button data-min="20">20</button><button data-min="30">30</button><button data-min="45">45</button>
          </div>
          <label class="t-campo"><span>duración</span><input type="number" id="timerMin" min="1" max="600" step="1" inputmode="numeric"><span>min</span></label>
          <label class="t-campo"><span>aviso</span><input type="number" id="timerAviso" min="0" max="120" step="1" inputmode="numeric"><span>min antes del final</span></label>
          <div class="t-acc">
            <button id="timerPlay">iniciar</button>
            <button id="timerReset">reiniciar</button>
          </div>
        </div>
      </span>
      <button id="aLista" class="solo-lector" title="Volver a la lista de ponencias">ponencias</button>
      <button id="export" class="solo-lector" disabled title="Descargar las anotaciones como .json con el mismo nombre de la ponencia, para subirlo a anotaciones/">exportar .json</button>
      <button id="toggleToc" class="solo-lector" title="Mostrar u ocultar el índice">índice</button>
      <button id="togglePanel" class="solo-lector" title="Mostrar u ocultar el panel de anotaciones">anotaciones</button>
      <button id="tablet" title="Modo táctil: botón anotar fijo y objetivos grandes">tablet</button>
    </div>
    <div id="contador" class="solo-lector"></div>
  </header>

  <main>
    <nav id="toc" class="solo-lector" aria-label="Tabla de contenidos">
      <h2>Contenido</h2>
      <div id="tocList"></div>
    </nav>
    <section id="read">
      <div id="lista" class="solo-lista">
        <h2 class="rotulo">Ponencias</h2>
        <div id="listaEstado" class="estado" role="status"></div>
        <ol id="listaItems"></ol>
      </div>
      <div id="docEstado" class="estado solo-lector" role="status"></div>
      <article id="doc" class="solo-lector"></article>
    </section>

    <aside id="panel" class="solo-lector">
      <h2>Anotaciones</h2>
      <button id="anotarBtn" disabled>＋ anotar selección</button>
      <div id="list"><p class="vacio">Sin anotaciones todavía.</p></div>
    </aside>
  </main>

  <button id="fab" title="Crear anotación">＋ anotar</button>
  <div id="stats" class="solo-lector"></div>

  <div id="controlesVis" class="solo-lector">
    <button id="btnAjustes" title="Ajustes de lectura">ajustes</button>
    <div id="ajustesPanel" class="hide">
      <div class="ajuste-row">
        <span>ancho</span>
        <input type="range" id="ancho" min="60" max="160" step="2" value="68">
        <span class="val" id="ancho-v">68</span>
      </div>
    </div>
  </div>

<script>
(function(){
  'use strict';

  // =====================================================================
  // Lógica pura, sin DOM. Se expone en window.forjaPonencias para pruebas.
  // =====================================================================
  const L = (function(){
    const CARPETA = 'ponencias/';
    const NOTAS = 'anotaciones/';   // anotaciones/x.json acompaña a ponencias/x.md

    function segmentosValidos(segs){
      return segs.length > 0 && segs.every(s => s && s !== '.' && s !== '..' && !/[\\\u0000-\u001f]/.test(s));
    }
    // ruta del manifiesto ("/ponencias/x.md") → "ponencias/x.md", o null si no está en la carpeta o no tiene la extensión
    function normalizarEn(r, carpeta, ext){
      if (typeof r !== 'string') return null;
      r = r.replace(/^\/+/, '');
      if (r.slice(0, carpeta.length) !== carpeta) return null;
      if (!ext.test(r)) return null;
      if (!segmentosValidos(r.split('/'))) return null;
      return r;
    }
    function normalizarRuta(r){ return normalizarEn(r, CARPETA, /\.md$/i); }
    function normalizarRutaNotas(r){ return normalizarEn(r, NOTAS, /\.json$/i); }
    function idDeRuta(ruta){ return ruta.slice(CARPETA.length).replace(/\.md$/i, ''); }
    function idDeRutaNotas(ruta){ return ruta.slice(NOTAS.length).replace(/\.json$/i, ''); }
    function rutaDeId(id){
      if (typeof id !== 'string' || !id) return null;
      if (!segmentosValidos(id.split('/'))) return null;
      return CARPETA + id + '.md';
    }
    function rutaNotasDeId(id){ const r = rutaDeId(id); return r ? NOTAS + id + '.json' : null; }
    function urlDeRuta(ruta){ return ruta.split('/').map(encodeURIComponent).join('/'); }
    function hashDeId(id){ return '#/' + id.split('/').map(encodeURIComponent).join('/'); }
    function idDeHash(h){
      if (typeof h !== 'string' || h.slice(0, 2) !== '#/') return null;
      try { return decodeURIComponent(h.slice(2)); } catch(e){ return null; }
    }
    function nombreLegible(id){
      const ult = String(id).split('/').pop();
      return ult.replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim() || ult;
    }

    // quita la sintaxis inline más común para mostrar un título limpio
    function limpiarInline(s){
      const esc = [];
      s = String(s).replace(/\\([\\`*_{}\[\]()#+\-.!~|])/g, (m, c) => { esc.push(c); return '\u0000' + (esc.length - 1) + '\u0000'; });
      s = s.replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
           .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
           .replace(/<[^>]+>/g, '')
           .replace(/\*\*|__|~~|\*|`/g, '')
           .replace(/(^|[\s(\[])_+(?=\S)/g, '$1')
           .replace(/(\S)_+(?=$|[\s).,;:!?\]])/g, '$1');
      s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => esc[+i]);
      return s.replace(/\s+/g, ' ').trim();
    }
    // primer encabezado de nivel 1 (ATX «# …» o setext «…\n===») fuera de bloques de código
    function tituloDeMd(md){
      const lineas = String(md).replace(/^﻿/, '').split(/\r?\n/);
      let valla = null;
      for (let i = 0; i < lineas.length; i++){
        const ln = lineas[i];
        const v = ln.match(/^ {0,3}(`{3,}|~{3,})/);
        if (v){
          if (!valla) valla = v[1];
          else if (v[1][0] === valla[0] && v[1].length >= valla.length) valla = null;
          continue;
        }
        if (valla) continue;
        const h = ln.match(/^ {0,3}#[ \t]+(.+?)(?:[ \t]+#+)?[ \t]*$/);
        if (h){ const t = limpiarInline(h[1]); if (t) return t; continue; }
        if (ln.trim() && !/^ {0,3}([-*+>#]|\d+[.)])/.test(ln) && i + 1 < lineas.length && /^ {0,3}=+[ \t]*$/.test(lineas[i + 1])){
          const t = limpiarInline(ln); if (t) return t;
        }
      }
      return null;
    }

    function sufijoComun(a, b){ let i = 0; while (i < a.length && i < b.length && a[a.length-1-i] === b[b.length-1-i]) i++; return i; }
    function prefijoComun(a, b){ let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; }
    // ubica una cita en el texto; con varias apariciones, gana la de mejor contexto
    function buscarCita(texto, exact, prefix, suffix){
      if (!exact) return null;
      prefix = prefix || ''; suffix = suffix || '';
      const hits = []; let i = texto.indexOf(exact);
      while (i !== -1){ hits.push(i); i = texto.indexOf(exact, i + 1); }
      if (!hits.length) return null;
      let best = hits[0], score = -1;
      if (hits.length > 1){
        for (const s of hits){
          const pre = texto.slice(Math.max(0, s - prefix.length), s);
          const suf = texto.slice(s + exact.length, s + exact.length + suffix.length);
          const sc = sufijoComun(pre, prefix) + prefijoComun(suf, suffix);
          if (sc > score){ score = sc; best = s; }
        }
      }
      return { start: best, end: best + exact.length };
    }

    function hash32(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(16); }

    function parsearManifiesto(texto){
      const t = String(texto).replace(/^﻿/, '').trim();
      if (/^---/.test(t) || t.indexOf('{%') !== -1) return { ok: false, error: 'sin-procesar' };
      let data;
      try { data = JSON.parse(t); } catch(e){ return { ok: false, error: 'json', detalle: e.message }; }
      const arr = data && Array.isArray(data.ponencias) ? data.ponencias : null;
      if (!arr) return { ok: false, error: 'formato' };
      // .json de anotaciones/ con el mismo nombre (y subcarpeta) que la ponencia
      const notas = new Map();
      for (const p of (Array.isArray(data.anotaciones) ? data.anotaciones : [])){
        const ruta = normalizarRutaNotas(p && p.ruta);
        if (ruta && !notas.has(idDeRutaNotas(ruta))) notas.set(idDeRutaNotas(ruta), ruta);
      }
      const vistos = new Set(), entradas = [];
      for (const p of arr){
        const ruta = normalizarRuta(p && p.ruta);
        if (!ruta) continue;
        const id = idDeRuta(ruta);
        if (vistos.has(id)) continue;
        vistos.add(id);
        entradas.push({ id, ruta, notas: notas.get(id) || null });

    function resolverEnlace(href, rutaDoc, baseHref){
      href = String(href || '').trim();
      if (!href) return { tipo: 'nada' };
      if (href[0] === '#') return { tipo: 'ancla', frag: href.slice(1) };
      let base, u;
      try {
        base = new URL('.', baseHref);
        u = new URL(href, new URL(urlDeRuta(rutaDoc), base));
      } catch(e){ return { tipo: 'nada' }; }
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return { tipo: 'otro', href: href };
      if (u.origin !== base.origin) return { tipo: 'externo', href: u.href };
      const pref = base.pathname + CARPETA;
      if (u.pathname.slice(0, pref.length) === pref && /\.md$/i.test(u.pathname)){
        let rel = null;
        try { rel = decodeURIComponent(u.pathname.slice(pref.length)); } catch(e){}
        const ruta = rel != null ? normalizarRuta(CARPETA + rel) : null;
        if (ruta) return { tipo: 'ponencia', id: idDeRuta(ruta) };
      }
      return { tipo: 'archivo', href: u.href };
    }
    // imágenes con ruta relativa: relativas a la carpeta del .md, no a index.html
    function resolverRecurso(src, rutaDoc, baseHref){
      src = String(src || '').trim();
      if (!src || /^([a-z][a-z0-9+.\-]*:|\/|#)/i.test(src)) return src;
      try { return new URL(src, new URL(urlDeRuta(rutaDoc), new URL('.', baseHref))).href; } catch(e){ return src; }
    }

    function slug(s){ return String(s).trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s/g, '-'); }

    // ---- timer: el estado guarda la hora de inicio, no un contador, para sobrevivir a recargas
    //      y a la suspensión de la pestaña. Funciones puras: reciben «ahora» y devuelven estado nuevo.
    const MIN = 60000;
    const acotar = (v, a, b) => Math.max(a, Math.min(b, v));
    const timer = {
      nuevo(min, avisoMin){
        const dur = Math.round(acotar(+min || 20, 1, 600) * MIN);
        return { dur, aviso: Math.min(dur, Math.round(acotar(+avisoMin || 0, 0, 120) * MIN)), inicio: null, previo: 0 };
      },
      cargar(raw){
        try {
          const o = typeof raw === 'string' ? JSON.parse(raw) : raw;
          if (o && Number.isFinite(o.dur) && o.dur > 0 && Number.isFinite(o.aviso) && Number.isFinite(o.previo) && o.previo >= 0
              && (o.inicio === null || Number.isFinite(o.inicio)))

        } catch(e){}
        return timer.nuevo(20, 5);
      },
      corriendo(e){ return e.inicio != null; },
      transcurrido(e, ahora){ return e.previo + (e.inicio != null ? Math.max(0, ahora - e.inicio) : 0); },
      restante(e, ahora){ return e.dur - timer.transcurrido(e, ahora); },
      iniciar(e, ahora){ return e.inicio != null ? e : Object.assign({}, e, { inicio: ahora }); },
      pausar(e, ahora){ return e.inicio == null ? e : Object.assign({}, e, { inicio: null, previo: timer.transcurrido(e, ahora) }); },
      reiniciar(e){ return Object.assign({}, e, { inicio: null, previo: 0 }); },
      configurar(e, min, avisoMin){
        const n = timer.nuevo(min, avisoMin);
        return Object.assign({}, e, { dur: n.dur, aviso: n.aviso });
      },
      // quieto: sin empezar · normal · aviso: dentro del margen final · excedido: tiempo cumplido
      fase(e, ahora){
        if (e.inicio == null && e.previo === 0) return 'quieto';
        const r = timer.restante(e, ahora);
        if (r <= 0) return 'excedido';
        if (r <= e.aviso) return 'aviso';
        return 'normal';
      },
      // cuenta regresiva redondeando hacia arriba (llega a 00:00 justo al final); después, +tiempo excedido
      formato(ms){
        const neg = ms <= 0;
        const s = neg ? Math.floor(-ms / 1000) : Math.ceil(ms / 1000);
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
        const dd = (n) => String(n).padStart(2, '0');

    // devuelve las anotaciones nuevas (sin anclar todavía) y cuántos comentarios se agregaron
    function fusionar(locales, entrantes){
      const nuevas = []; let comentarios = 0;
      const porId = new Map(locales.map(a => [a.id, a]));
      for (const a of entrantes){
        const ex = porId.get(a.id);
        if (!ex){ porId.set(a.id, a); nuevas.push(a); continue; }
        const claves = new Set(ex.comentarios.map(c => c.creado + '\u0000' + c.texto));
        let cambio = false;
        for (const c of a.comentarios){
          const k = c.creado + '\u0000' + c.texto;
          if (!claves.has(k)){ claves.add(k); ex.comentarios.push(c); comentarios++; cambio = true; }
        }

      return { nuevas, comentarios };

      if (r.ok) entradas = r.entradas;

    catch(err){ if (t === token) errorLector('No se pudo descargar ' + ruta + ': sin conexión.'); return; }

  // ===== persistencia por ponencia (localStorage de este navegador) =====
  function guardarNotas(){
    if (!actual) return true;
    const k = L.claveNotas(BASE_PATH, actual.id);
    try {
      if (!annos.length) localStorage.removeItem(k);
      else localStorage.setItem(k, JSON.stringify(buildPayload()));
      return true;
    } catch(e){
      aviso('no se pudieron guardar las notas en este navegador: exporta el .json', 9000);
      return false;
    }
  }
  function leerNotas(id){
    try { const s = localStorage.getItem(L.claveNotas(BASE_PATH, id)); return s ? JSON.parse(s) : null; }
    catch(e){ return null; }
  }
  function cargarNotasGuardadas(){
    annos = []; activeId = null;
    const data = leerNotas(actual.id);
    if (!data || !Array.isArray(data.anotaciones)) return;
    for (const it of data.anotaciones){
      if (!it || typeof it !== 'object') continue;
      const a = desdeItem(it);
      if (!a.exact) continue;
      anclarAnno(a, a.textoPlano); delete a.textoPlano;
      annos.push(a);
    }
    annos.sort(cmpAnnos);
    const cambio = !!(data.documento && data.documento.hashMd && data.documento.hashMd !== L.hash32(rawMd));
    if (cambio) guardarNotas();   // refresca offsets y hash; las huérfanas se conservan con su cita
    const huerf = annos.filter(a => a.huerfana).length;
    if (huerf) aviso(huerf + (huerf === 1 ? ' nota sin anclar' : ' notas sin anclar') + (cambio ? ': el texto cambió' : ''), 8000);
  }

  // ===== anotaciones del repositorio: anotaciones/<nombre>.json =====
  // Se fusionan con las de este navegador cada vez que el archivo del repo cambia.
  // Mientras no cambie, lo que se borra aquí no vuelve a aparecer. Si una versión nueva
  // ya no trae una nota que la anterior sí traía, se borró en el origen y se borra aquí.
  function leerRepo(k){
    let raw = null;
    try { raw = localStorage.getItem(k); } catch(e){}
    if (raw == null) return null;
    try { const o = JSON.parse(raw); if (o && typeof o === 'object' && typeof o.hash === 'string') return o; } catch(e){}
    return { hash: String(raw), ids: [] };
  }
  async function cargarNotasRepo(t){
    if (!actual) return;
    const e = entradas ? entradas.find(x => x.id === actual.id) : null;
    const ruta = entradas ? (e && e.notas) : L.rutaNotasDeId(actual.id);
    if (!ruta) return;
    let res;
    try { res = await fetch(L.urlDeRuta(ruta), { cache: 'no-cache' }); } catch(err){ return; }
    if (t !== token || !res.ok) return;
    let texto;
    try { texto = await res.text(); } catch(err){ return; }
    if (t !== token) return;
    const h = L.hash32(texto), kRepo = L.claveRepo(BASE_PATH, actual.id);
    const previo = leerRepo(kRepo);
    if (previo && previo.hash === h) return;
    let data;
    try { data = JSON.parse(texto); } catch(err){ aviso(ruta + ' no es JSON válido', 9000); return; }
    const items = Array.isArray(data) ? data : (data && Array.isArray(data.anotaciones) ? data.anotaciones : null);
    if (!items){ aviso(ruta + ' no tiene anotaciones reconocibles', 9000); return; }
    const entrantes = items.filter(it => it && typeof it === 'object').map(desdeItem).filter(a => a.exact);
    const idsNuevos = new Set(entrantes.map(a => a.id));
    const quitar = new Set(previo && Array.isArray(previo.ids) ? previo.ids.filter(id => !idsNuevos.has(id)) : []);
    const antes = annos.length;
    annos = annos.filter(a => !quitar.has(a.id));
    const borradas = antes - annos.length;
    if (activeId && quitar.has(activeId)) activeId = null;
    const r = L.fusionar(annos, entrantes);
    let huerf = 0;
    for (const a of r.nuevas){
      anclarAnno(a, a.textoPlano); delete a.textoPlano;
      if (a.huerfana) huerf++;
      annos.push(a);
    }
    annos.sort(cmpAnnos);
    if (guardarNotas()){ try { localStorage.setItem(kRepo, JSON.stringify({ hash: h, ids: [...idsNuevos] })); } catch(err){} }
    refreshHighlights(); renderList(); updateChrome();
    const n = r.nuevas.length, c = r.comentarios;
    const partes = [];
    if (n) partes.push(n + (n === 1 ? ' nota' : ' notas') + (huerf ? ' (' + huerf + ' sin anclar)' : ''));
    if (c) partes.push(c + (c === 1 ? ' comentario' : ' comentarios'));
    if (borradas) partes.push(borradas + (borradas === 1 ? ' borrada' : ' borradas'));
    if (partes.length) aviso('desde ' + ruta + ': ' + partes.join(', '), 7000);
  }

  // ===== captura de selección =====
  function captureSelection(){
    if (!actual) return null;
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
    const range = sel.getRangeAt(0);
    if (range.collapsed) return null;
    if (!docEl.contains(range.commonAncestorContainer)) return null;
    const start = pointOffset(range.startContainer, range.startOffset);
    const end = pointOffset(range.endContainer, range.endOffset);
    if (start == null || end == null || end <= start) return null;
    const exact = docText.slice(start, end);
    if (!exact.trim()) return null;
    const md = mdOffset(exact);
    return {
      range: range.cloneRange(), exact, start, end,
      prefix: docText.slice(Math.max(0, start - CTX), start),
      suffix: docText.slice(end, end + CTX),
      mdStart: md.start, mdEnd: md.end, mdUnico: md.unico
    };
  }

  // ===== resaltado =====
  const canHL = (typeof CSS !== 'undefined') && ('highlights' in CSS) && (typeof Highlight === 'function');
  function refreshHighlights(){
    if (!canHL) return;
    const base = new Highlight(), act = new Highlight();
    for (const a of annos){
      if (!a.range) continue;
      (a.id === activeId ? act : base).add(a.range);
    }
    CSS.highlights.set('forja-nota', base);
    CSS.highlights.set('forja-activa', act);
  }

  // ===== crear, borrar, activar =====
  function addAnno(){
    if (!pending || !actual) return;
    const a = Object.assign({ id: nuevoId(), comentarios: [], creado: new Date().toISOString(), huerfana: false }, pending);
    annos.push(a);
    annos.sort(cmpAnnos);
    activeId = a.id; pending = null;
    hideFab();
    const sel = window.getSelection(); if (sel) sel.removeAllRanges();
    guardarNotas();
    refreshHighlights(); renderList(true); updateChrome();
  }
  function removeAnno(id){
    annos = annos.filter(a => a.id !== id);
    if (activeId === id) activeId = null;
    guardarNotas();
    refreshHighlights(); renderList(); updateChrome();
  }
  function setActive(id){
    activeId = id;
    list.querySelectorAll('.nota').forEach(n => n.classList.toggle('activa', n.dataset.id === id));
    refreshHighlights();
  }
  function gotoAnno(id){
    setActive(id);
    const a = annos.find(x => x.id === id);
    if (a && a.range && typeof a.range.getBoundingClientRect === 'function'){
      const rc = a.range.getBoundingClientRect(), cc = read.getBoundingClientRect();
      read.scrollTop += (rc.top - cc.top) - 100;
    }
  }

  // ===== lista lateral =====
  function autoGrow(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
  function fmtFecha(iso){
    const d = new Date(iso);
    if (isNaN(d)) return '';
    try { return d.toLocaleString('es', { dateStyle: 'short', timeStyle: 'short' }); }
    catch(e){ return d.toISOString().slice(0, 16).replace('T', ' '); }
  }
  function commentNode(a, c){
    const row = document.createElement('div');
    row.className = 'coment';
    const tx = document.createElement('div');
    tx.className = 'coment-tx';
    tx.textContent = c.texto;
    const meta = document.createElement('div');
    meta.className = 'coment-meta';
    const when = document.createElement('span');
    when.textContent = fmtFecha(c.creado);
    const x = document.createElement('button');
    x.className = 'cdel'; x.textContent = '×'; x.title = 'Borrar comentario';
    x.addEventListener('click', () => { a.comentarios = a.comentarios.filter(k => k !== c); guardarNotas(); renderList(); updateChrome(); });
    meta.append(when, x);
    row.append(tx, meta);
    return row;
  }
  function renderList(focusNew){
    list.innerHTML = '';
    if (!annos.length){
      list.innerHTML = '<p class="vacio">Selecciona texto y pulsa «anotar» para empezar.</p>';
      return;
    }
    for (const a of annos){
      const item = document.createElement('div');
      item.className = 'nota' + (a.id === activeId ? ' activa' : '') + (a.huerfana ? ' huerfana' : '');
      item.dataset.id = a.id;

      const q = document.createElement('div');
      q.className = 'quote';
      q.textContent = a.exact.length > 160 ? a.exact.slice(0, 160) + '…' : a.exact;
      q.title = 'Ir al pasaje';
      q.addEventListener('click', () => gotoAnno(a.id));

      const coments = document.createElement('div');
      coments.className = 'coments';
      for (const c of a.comentarios) coments.appendChild(commentNode(a, c));

      const add = document.createElement('div');
      add.className = 'add';
      const ta = document.createElement('textarea');
      ta.className = 'add-in';
      ta.placeholder = 'Añadir comentario… (Enter guarda)';
      ta.enterKeyHint = 'done';
      ta.addEventListener('input', () => autoGrow(ta));
      ta.addEventListener('focus', () => setActive(a.id));
      const doAdd = () => {
        const t = ta.value.trim(); if (!t) return;
        const c = { texto: t, creado: new Date().toISOString() };
        a.comentarios.push(c);
        coments.appendChild(commentNode(a, c));
        ta.value = ''; autoGrow(ta); ta.focus();
        guardarNotas();
        updateChrome();
      };
      ta.addEventListener('keydown', e => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); doAdd(); }
      });
      const btn = document.createElement('button');
      btn.className = 'add-btn'; btn.textContent = 'añadir';
      btn.addEventListener('click', doAdd);
      add.append(ta, btn);

      const fila = document.createElement('div');
      fila.className = 'fila';
      const pos = document.createElement('span');
      pos.className = 'pos';
      pos.textContent = (a.huerfana || a.start == null)
        ? 'sin anclar: el pasaje ya no está en el texto'
        : ('plano ' + a.start + '–' + a.end +
           (a.mdStart != null ? ' · md ' + a.mdStart + '–' + a.mdEnd + (a.mdUnico ? '' : ' (múltiple)') : ' · md n/d'));
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = 'eliminar';
      del.addEventListener('click', () => removeAnno(a.id));
      fila.append(pos, del);

      item.append(q, coments, add, fila);
      list.appendChild(item);
      autoGrow(ta);
      if (focusNew && a.id === activeId) ta.focus();
    }
  }

  function updateChrome(){
    $('export').disabled = !actual || !annos.length;
    $('contador').textContent = annos.length ? (annos.length + (annos.length === 1 ? ' anotación' : ' anotaciones')) : '';
    $('controlesVis').style.display = actual ? 'block' : 'none';
    updateStats();
  }

  // ===== paneles: índice y anotaciones =====
  function leerPref(k){ try { return localStorage.getItem('forja-ponencias:' + k); } catch(e){ return null; } }
  function guardarPref(k, v){ try { localStorage.setItem('forja-ponencias:' + k, v); } catch(e){} }
  function aplicarToc(visible){
    document.body.classList.toggle('no-toc', !visible);
    $('toggleToc').classList.toggle('inactivo', !visible);
  }
  function aplicarPanel(visible){
    document.body.classList.toggle('no-panel', !visible);
    $('togglePanel').classList.toggle('inactivo', !visible);
  }
  $('toggleToc').addEventListener('click', () => {
    const visible = document.body.classList.contains('no-toc');
    aplicarToc(visible); guardarPref('toc', visible ? '1' : '0');
  });
  $('togglePanel').addEventListener('click', () => {
    const visible = document.body.classList.contains('no-panel');
    aplicarPanel(visible); guardarPref('panel', visible ? '1' : '0');
  });
  aplicarToc(leerPref('toc') !== '0');
  aplicarPanel(leerPref('panel') !== '0');

  // ===== ajustes: ancho de lectura =====
  $('btnAjustes').addEventListener('click', e => { e.stopPropagation(); $('ajustesPanel').classList.toggle('hide'); });
  document.addEventListener('click', e => { if (!$('controlesVis').contains(e.target)) $('ajustesPanel').classList.add('hide'); });
  function aplicarAncho(v){
    v = Math.max(60, Math.min(160, +v || 68));
    docEl.style.maxWidth = v + 'ch';
    $('ancho').value = v;
    $('ancho-v').textContent = v;
  }
  $('ancho').addEventListener('input', () => { aplicarAncho($('ancho').value); guardarPref('ancho', $('ancho').value); });
  { const a = leerPref('ancho'); if (a != null) aplicarAncho(a); }

  // ===== contador =====
  function miles(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function updateStats(){
    const el = $('stats');
    if (!actual){ el.style.display = 'none'; return; }
    const palabras = (docText.match(/\S+/g) || []).length;
    const pags = Math.ceil(palabras / 500);
    el.style.display = 'block';
    el.textContent = miles(palabras) + ' palabras · ' + miles(docText.length) + ' caracteres · '
      + pags + (pags === 1 ? ' página' : ' páginas');
  }

  // ===== botón flotante y botón fijo (tablet) =====
  function showFab(range){
    fab.classList.add('on');
    const rects = typeof range.getClientRects === 'function' ? range.getClientRects() : [];
    const r = rects.length ? rects[rects.length - 1]
      : (typeof range.getBoundingClientRect === 'function' ? range.getBoundingClientRect() : { right: 0, top: 0, bottom: 0 });
    const fw = fab.offsetWidth || 96, fh = fab.offsetHeight || 40;
    const left = Math.max(8, Math.min(r.right, window.innerWidth - fw - 8));
    let top = r.bottom + 8;
    if (top + fh > window.innerHeight - 8) top = Math.max(8, r.top - fh - 8);
    fab.style.left = left + 'px';
    fab.style.top = top + 'px';
  }
  function hideFab(){ fab.classList.remove('on'); }
  function tabletOn(){ return document.body.classList.contains('tablet'); }
  function setAnotar(on){ const b = $('anotarBtn'); b.disabled = !on; b.classList.toggle('lista', on); }
  function tryShowFab(){
    const cap = captureSelection();
    if (!cap){ hideFab(); setAnotar(false); pending = null; return; }
    pending = cap;
    if (tabletOn()) setAnotar(true);
    else showFab(cap.range);
  }
  let selTimer = null;
  function tryShowFabDebounced(){ clearTimeout(selTimer); selTimer = setTimeout(tryShowFab, 250); }
  document.addEventListener('selectionchange', tryShowFabDebounced);
  read.addEventListener('mouseup', tryShowFab);
  read.addEventListener('touchend', tryShowFabDebounced);
  fab.addEventListener('click', addAnno);
  $('anotarBtn').addEventListener('click', () => { if (pending){ addAnno(); setAnotar(false); } });
  document.addEventListener('pointerdown', e => { if (!fab.contains(e.target)) hideFab(); });
  read.addEventListener('scroll', () => { if (!tabletOn()) hideFab(); });

  function aplicarTablet(on){
    document.body.classList.toggle('tablet', on);
    $('tablet').classList.toggle('activo', on);
    $('tablet').textContent = on ? 'tablet ✓' : 'tablet';
    hideFab(); tryShowFab();
  }
  $('tablet').addEventListener('click', () => {
    const on = !tabletOn();
    aplicarTablet(on); guardarPref('tablet', on ? '1' : '0');
  });
  {
    const pref = leerPref('tablet');
    const touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
    aplicarTablet(pref != null ? pref === '1' : touch);
  }

  // ===== exportar =====
  function buildPayload(){
    return {
      forjaAnotador: '1',
      generado: new Date().toISOString(),
      documento: {
        nombre: actual.ruta.split('/').pop(),
        ruta: actual.ruta,
        hashMd: L.hash32(rawMd),
        longitudMd: rawMd.length,
        longitudPlano: docText.length
      },
      anotaciones: annos.map(a => ({
        id: a.id,
        creado: a.creado,
        objetivo: {
          exact: a.exact,
          prefix: a.prefix,
          suffix: a.suffix,
          textoPlano: (a.start != null && a.end != null) ? { start: a.start, end: a.end } : null,
          fuenteMd: a.mdStart == null ? null : { start: a.mdStart, end: a.mdEnd, unico: a.mdUnico }
        },
        comentarios: a.comentarios.map(c => ({ texto: c.texto, creado: c.creado }))
      }))
    };
  }
  $('export').addEventListener('click', () => {
    if (!actual || !annos.length) return;
    const blob = new Blob([JSON.stringify(buildPayload(), null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const el = document.createElement('a');
    el.href = url;
    el.download = actual.id.split('/').pop() + '.json';   // mismo nombre que la ponencia: va a anotaciones/
    document.body.appendChild(el); el.click(); el.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  $('marca').addEventListener('click', () => location.reload());

  if (!canHL) $('contador').title = 'Este navegador no resalta en pantalla, pero las anotaciones y el export funcionan.';

  // ===== timer de la ponencia =====
  const T = L.timer;
  let timerEst = T.cargar(leerPref('timer'));
  let timerTick = null;
  function guardarTimer(){ guardarPref('timer', JSON.stringify(timerEst)); }
  function pintarTimer(){
    const ahora = Date.now(), f = T.fase(timerEst, ahora), corre = T.corriendo(timerEst);
    const txt = T.formato(T.restante(timerEst, ahora));
    const b = $('timer');
    b.textContent = f === 'quieto' ? 'timer' : (corre ? '' : '‖ ') + txt;
    b.classList.toggle('t-corriendo', corre && f === 'normal');
    b.classList.toggle('t-pausa', !corre && f !== 'quieto');
    b.classList.toggle('t-aviso', f === 'aviso');
    b.classList.toggle('t-excedido', f === 'excedido');
    b.title = f === 'quieto' ? 'Timer de la ponencia (' + T.formato(timerEst.dur) + ')'
      : (f === 'excedido' ? 'Tiempo cumplido' : 'Tiempo restante') + (corre ? '' : ' · en pausa');
    const g = $('timerGrande');
    g.textContent = txt;
    g.className = 't-grande f-' + f;
    $('timerEstado').textContent = f === 'quieto' ? 'sin empezar'
      : f === 'excedido' ? 'tiempo cumplido' + (corre ? '' : ' · en pausa')
      : (corre ? 'en curso' : 'en pausa');
    $('timerPlay').textContent = corre ? 'pausar' : (f === 'quieto' ? 'iniciar' : 'reanudar');
    const min = timerEst.dur / 60000;
    $('timerPresets').querySelectorAll('button').forEach(p => p.classList.toggle('sel', +p.dataset.min === min));
  }
  function programarTick(){
    clearInterval(timerTick); timerTick = null;
    if (T.corriendo(timerEst)) timerTick = setInterval(pintarTimer, 250);
  }
  function actualizarTimer(nuevo){ timerEst = nuevo; guardarTimer(); programarTick(); pintarTimer(); }
  function sincronizarCampos(){
    $('timerMin').value = +(timerEst.dur / 60000).toFixed(2);
    $('timerAviso').value = +(timerEst.aviso / 60000).toFixed(2);
  }
  function abrirTimer(abrir){
    const p = $('timerPanel');
    p.classList.toggle('hide', !abrir);
    $('timer').setAttribute('aria-expanded', abrir ? 'true' : 'false');
    if (!abrir) return;
    sincronizarCampos(); pintarTimer();
    // que no se salga por la derecha en pantallas angostas
    p.style.left = '0px';
    const rc = p.getBoundingClientRect();
    if (rc.right > window.innerWidth - 8) p.style.left = Math.min(0, window.innerWidth - 8 - rc.right) + 'px';
  }
  $('timer').addEventListener('click', e => { e.stopPropagation(); abrirTimer($('timerPanel').classList.contains('hide')); });
  $('timerPanel').addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => { if (!$('timerPanel').classList.contains('hide')) abrirTimer(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('timerPanel').classList.contains('hide')){ abrirTimer(false); $('timer').focus(); } });
  $('timerPresets').addEventListener('click', e => {
    const b = e.target.closest('button[data-min]'); if (!b) return;
    actualizarTimer(T.configurar(timerEst, +b.dataset.min, timerEst.aviso / 60000));
    sincronizarCampos();
  });
  function leerCampos(){
    const min = parseFloat($('timerMin').value), av = parseFloat($('timerAviso').value);
    actualizarTimer(T.configurar(timerEst,
      Number.isFinite(min) && min > 0 ? min : timerEst.dur / 60000,
      Number.isFinite(av) && av >= 0 ? av : timerEst.aviso / 60000));
    sincronizarCampos();
  }
  $('timerMin').addEventListener('change', leerCampos);
  $('timerAviso').addEventListener('change', leerCampos);
  [$('timerMin'), $('timerAviso')].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); i.blur(); leerCampos(); } }));
  $('timerPlay').addEventListener('click', () => {
    const ahora = Date.now();
    actualizarTimer(T.corriendo(timerEst) ? T.pausar(timerEst, ahora) : T.iniciar(timerEst, ahora));
  });
  $('timerReset').addEventListener('click', () => actualizarTimer(T.reiniciar(timerEst)));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pintarTimer(); });
  pintarTimer(); programarTick();

  window.forjaPonencias = { logica: L };
  route();
})();
</script>
</body>
</html>
